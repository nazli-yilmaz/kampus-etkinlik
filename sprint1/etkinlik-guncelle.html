<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Etkinlik Güncelle</title>
</head>

<body>

    <header>
        <h1>Kampüs Etkinlikleri</h1>

        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-detay.html">Detay</a>
            <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>

        <h2>Etkinlik Güncelle</h2>

        <form>

            <label for="etkinlik-adi">Etkinlik Adı</label>
            <input 
                type="text" 
                id="etkinlik-adi"
                value="Kariyer Günleri 2026"
                required
            >

            <br><br>

            <label for="kategori">Kategori</label>
            <select id="kategori" required>
                <option value="seminer" selected>Seminer</option>
                <option value="atolye">Atölye</option>
                <option value="konferans">Konferans</option>
            </select>

            <br><br>

            <label for="tarih">Tarih</label>
            <input 
                type="date" 
                id="tarih"
                value="2026-10-12"
                required
            >

            <br><br>

            <label for="saat">Saat</label>
            <input 
                type="time" 
                id="saat"
                value="14:00"
                required
            >

            <br><br>

            <label for="yer">Yer</label>
            <input 
                type="text" 
                id="yer"
                value="A Blok Konferans Salonu"
                required
            >

            <br><br>

            <label for="aciklama">Açıklama</label>
            <textarea id="aciklama" required>Kariyer Günleri, öğrencilerin iş dünyası hakkında bilgi edinmesini ve farklı kariyer seçeneklerini tanımasını amaçlayan bir etkinliktir.</textarea>

            <br><br>

            <button type="submit">Güncelle</button>

        </form>

    </main>

    <footer>
        <p>Ad Soyad · 20xxxxxxx · 2026</p>
    </footer>

</body>

</html>
